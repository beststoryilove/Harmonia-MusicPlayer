<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=privacy.html">
  <meta name="description" content="Harmonia 音乐播放器的隐私政策与用户协议已拆分为两个独立页面。">
  <title>隐私政策与用户协议 · Harmonia</title>
  <style>
    @font-face{src:url(fonts/PingFangSC-Regular.woff2);font-family:"PingFangSC-Regular";font-display:swap}
    @font-face{src:url(fonts/sf-pro-display_regular.woff2);font-family:"SFPro-Regular";font-display:swap}
    @font-face{src:url(fonts/PingFangSC-Semibold.woff2);font-family:"PingFangSC-Semibold";font-display:swap}
    @font-face{src:url(fonts/sf-pro-display_semibold.woff2);font-family:"SFPro-Semibold";font-display:swap}

    :root{
      --bg:#000; --ink:#f5f5f7; --ink-2:rgba(255,255,255,.72); --ink-3:rgba(255,255,255,.48);
      --hairline:rgba(255,255,255,.09); --accent:#ff2d55; --accent-soft:rgba(255,45,85,.12);
      --font-body:"SFPro-Regular","PingFangSC-Regular",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
      --font-head:"SFPro-Semibold","PingFangSC-Semibold",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      font-family:var(--font-body); color:var(--ink); line-height:1.85;
      background:
        radial-gradient(1100px 620px at 82% -10%, rgba(255,45,85,.09), transparent 62%),
        radial-gradient(900px 560px at -12% 108%, rgba(88,86,214,.08), transparent 60%),
        var(--bg);
      background-attachment:fixed; min-height:100vh;
      -webkit-font-smoothing:antialiased;
      display:flex; align-items:center; justify-content:center; padding:32px 20px;
    }
    ::selection{background:rgba(255,45,85,.38);color:#fff}
    .card{max-width:520px;width:100%;text-align:center}
    .brand-mark{
      width:48px;height:48px;border-radius:14px;margin:0 auto 20px;
      background:linear-gradient(135deg,#ff2d55,#b8345f);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 8px 24px rgba(255,45,85,.24);
    }
    .brand-mark svg{width:24px;height:24px;fill:#fff}
    h1{font-family:var(--font-head);font-size:22px;font-weight:700;letter-spacing:.3px;margin-bottom:10px}
    p{font-size:14.5px;color:var(--ink-2);margin-bottom:26px}
    .links{display:flex;flex-direction:column;gap:12px}
    a.btn{
      display:flex;align-items:center;justify-content:center;gap:9px;
      padding:14px 26px;border-radius:999px;text-decoration:none;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
      color:var(--ink);font-size:14.5px;font-weight:600;
      transition:background .18s ease,border-color .18s ease;
    }
    a.btn:hover{background:rgba(255,45,85,.14);border-color:rgba(255,45,85,.4)}
    a.btn.primary{background:var(--accent-soft);border-color:rgba(255,45,85,.35)}
    .hint{margin-top:24px;font-size:12.5px;color:var(--ink-3)}
    .hint a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--hairline)}
    .hint a:hover{color:var(--ink)}
  </style>
  <script>
    /* 立即跳转到隐私政策页；脚本被禁时由上方 meta refresh 兜底 */
    location.replace('privacy.html');
  </script>
</head>
<body>
  <main class="card">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <h1>隐私政策与用户协议</h1>
    <p>本页内容已拆分为两个独立页面，正在为你跳转……</p>
    <div class="links">
      <a class="btn primary" href="privacy.html">隐私政策</a>
      <a class="btn" href="agreement.html">用户协议</a>
      <a class="btn" href="main.html">进入播放器</a>
    </div>
    <p class="hint">若未自动跳转，请点击上方链接。开源仓库 · <a href="https://github.com/beststoryilove/Harmonia-MusicPlayer" target="_blank" rel="noopener noreferrer">GitHub</a></p>
  </main>
</body>
</html>
